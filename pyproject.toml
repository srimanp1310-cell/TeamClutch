[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-gpu-opt"
version = "0.1.0"
description = "TikTok TechJam 2026 — Task 3: GPU kernel optimization for a Transformer layer"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

# Explicit package list. `src.strategies` must be named separately: setuptools
# does not descend into subpackages of an explicitly-listed package.
[tool.setuptools]
packages = ["src", "src.strategies", "bench", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
